<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DreamFIT — Profile</title>
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="../../firebase/state_listener.js"></script>
</head>
<body>
<header class="site-header">
  <div class="logo">Dream<span>FIT</span></div>
  <nav class="main-nav">
    <a href="index.html">Home</a>
    <a href="bmi.html">BMI</a>
     <a href="bodyfat.html">Body Fat %</a>
    <a href="workout.html">Workouts</a>
    <a href="nutrition.html">Nutrition</a>
    <a href="progress.html">Progress</a>
    <a href="profile.html" class="active">Profile</a>
    <button id="logout-btn" class="pill-btn">Logout</button>
    <script type="module" src="../../firebase/signout.js"></script>
  </nav>
</header>

<main class="page-narrow">
  <div class="card-section">
    <h2>Profile Information</h2>

    <!-- View Mode -->
    <div id="profile-view"></div>

    <!-- Edit Mode -->
    <form id="profile-edit" class="form" style="display:none;">
      <div class="field"><span>Email</span><input type="email" id="email" readonly /></div>
      <div class="field"><span>Age</span><input type="number" id="age" min="10" max="100" /></div>
      <div class="field"><span>Weight (kg)</span><input type="number" id="weight" step="0.1" /></div>
      <div class="field"><span>Height (cm)</span><input type="number" id="height" /></div>
      <div class="field"><span>Workouts per week</span><input type="number" id="workouts" /></div>

      <div class="field">
        <span>Activity Level</span>
        <select id="activity" required>
          <option value="">Select...</option>
          <option>Not very active</option>
          <option>Lightly active</option>
          <option>Active</option>
          <option>Very active</option>
        </select>
      </div>

      <div class="field">
        <span>Goal</span>
        <select id="goal" required>
          <option value="">Select...</option>
          <option>Lose weight</option>
          <option>Maintain weight</option>
          <option>Gain weight</option>
        </select>
      </div>

      <div class="field">
        <span>Sex</span>
        <select id="sex" required>
          <option value="">Select...</option>
          <option>Male</option>
          <option>Female</option>
        </select>
      </div>

      <div class="field"><span>Date of Birth</span><input type="date" id="dob" /></div>
      <div class="field"><span>Country</span><input type="text" id="country" /></div>

      <button type="submit" class="btn primary full-width">Save Changes</button>
    </form>

    <button id="edit-btn" class="btn primary">Edit Profile</button>
    <div id="alert" class="alert" style="display:none;"></div>
  </div>
</main>

<script type="module">
  import { auth } from "../../firebase/initialise.js";
  import { onAuthStateChanged } 
    from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

  const profileView = document.getElementById("profile-view");
  const profileEdit = document.getElementById("profile-edit");
  const editBtn = document.getElementById("edit-btn");
  const alertBox = document.getElementById("alert");

  let userData = {};

  onAuthStateChanged(auth, (user) => {
    if (!user) {
      window.location.href = "../fitness site back/login.html";
      return;
    }

    const email = user.email || "N/A";
    const stored = localStorage.getItem("dreamfit-user-details");
    userData = stored ? JSON.parse(stored) : {};
    userData.email = email;

    renderViewMode();
  });

  // Show profile info (view mode)
  function renderViewMode() {
    profileView.innerHTML = `
      <p><strong>Email:</strong> ${userData.email || "N/A"}</p>
      <p><strong>Age:</strong> ${userData.age || "N/A"}</p>
      <p><strong>Weight:</strong> ${userData.weight ? userData.weight + " kg" : "N/A"}</p>
      <p><strong>Height:</strong> ${userData.height ? userData.height + " cm" : "N/A"}</p>
      <p><strong>Workouts per week:</strong> ${userData.workouts || "N/A"}</p>
      <p><strong>Activity level:</strong> ${userData.activity || "N/A"}</p>
      <p><strong>Goal:</strong> ${userData.goal || "N/A"}</p>
      <p><strong>Sex:</strong> ${userData.sex || "N/A"}</p>
      <p><strong>Date of Birth:</strong> ${userData.dob || "N/A"}</p>
      <p><strong>Country:</strong> ${userData.country || "N/A"}</p>
    `;
    profileView.style.display = "block";
    profileEdit.style.display = "none";
    editBtn.style.display = "inline-block";
  }

  // Switch to edit mode
  editBtn.addEventListener("click", () => {
    profileView.style.display = "none";
    profileEdit.style.display = "block";
    editBtn.style.display = "none";
    alertBox.style.display = "none";

    // Fill inputs
    for (const key in userData) {
      const field = document.getElementById(key);
      if (field) field.value = userData[key];
    }
  });

  // Save changes
  profileEdit.addEventListener("submit", (e) => {
    e.preventDefault();

    userData = {
      age: profileEdit.age.value,
      weight: profileEdit.weight.value,
      height: profileEdit.height.value,
      workouts: profileEdit.workouts.value,
      activity: profileEdit.activity.value,
      goal: profileEdit.goal.value,
      sex: profileEdit.sex.value,
      dob: profileEdit.dob.value,
      country: profileEdit.country.value,
      email: profileEdit.email.value,
    };

    localStorage.setItem("dreamfit-user-details", JSON.stringify(userData));

    alertBox.textContent = "Profile updated successfully!";
    alertBox.classList.remove("error");
    alertBox.classList.add("success");
    alertBox.style.display = "block";

    renderViewMode();
  });
</script>
</body>
</html>
